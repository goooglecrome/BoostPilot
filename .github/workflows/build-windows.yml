name: Build BoostPilot for Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "BoostPilot_SourceOnly_v1.2.0.zip"
      - ".github/workflows/build-windows.yml"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract application source
        shell: pwsh
        run: |
          $archive = "BoostPilot_SourceOnly_v1.2.0.zip"
          if (-not (Test-Path $archive)) {
            throw "Missing $archive. Upload the BoostPilot source ZIP to the repository root, then run this workflow again."
          }
          Expand-Archive -Path $archive -DestinationPath build -Force
          if (-not (Test-Path "build/src/BoostPilot.App/BoostPilot.App.csproj")) {
            throw "The source archive did not contain the expected WPF project."
          }

      - name: Patch first-build compiler issues
        shell: pwsh
        run: |
          $main = "build/src/BoostPilot.App/MainWindow.xaml.cs"
          $optimizer = "build/src/BoostPilot.App/Services/OptimizerService.cs"
          $mainText = Get-Content $main -Raw
          if ($mainText -notmatch 'using System.Net.Http;') {
            $mainText = "using System.Net.Http;`r`n" + $mainText
          }
          $mainText = $mainText.Replace(", EasingFunction = new CubicEase { EasingMode = EasingMode.EaseOut }", "")
          Set-Content -Path $main -Value $mainText -Encoding utf8
          $optimizerText = Get-Content $optimizer -Raw
          if ($optimizerText -notmatch 'using System.IO;') {
            $optimizerText = "using System.IO;`r`n" + $optimizerText
          }
          Set-Content -Path $optimizer -Value $optimizerText -Encoding utf8

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Read app version
        shell: pwsh
        run: |
          $version = (Get-Content "build/VERSION" -Raw).Trim()
          "BOOSTPILOT_VERSION=$version" >> $env:GITHUB_ENV

      - name: Restore and publish self-contained app
        shell: pwsh
        run: |
          dotnet restore build/src/BoostPilot.App/BoostPilot.App.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish build/src/BoostPilot.App/BoostPilot.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o build/artifacts/publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6/ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler was not found." }
          & $compiler "/DBuildVersion=$env:BOOSTPILOT_VERSION" "build/installer/BoostPilot.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "build/artifacts/BoostPilot-Setup.exe")) { throw "Installer output was not created." }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: BoostPilot-Windows-Installer
          path: build/artifacts/BoostPilot-Setup.exe
          if-no-files-found: error

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.BOOSTPILOT_VERSION }}
          generate_release_notes: true
          files: build/artifacts/BoostPilot-Setup.exe
